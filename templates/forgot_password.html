
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | PromptMate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: #f5f3ff;
            background: linear-gradient(135deg, #100b20, #302052, #17132d);
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo {
            text-align: center;
            color: #c4a5ff;
            font-size: 29px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        h1 { text-align: center; font-size: 24px; margin-bottom: 12px; }

        .subtitle {
            text-align: center;
            color: #c3bad7;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label { display: block; margin-bottom: 8px; font-size: 14px; }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 10px;
            background: rgba(255,255,255,0.08);
            color: white;
            outline: none;
        }

        input:focus { border-color: #b18aff; }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #a477f5, #7651d5);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin-bottom: 18px;
            padding: 11px;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
            color: #e2d5ff;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .links {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        a { color: #c4a5ff; text-decoration: none; }
    </style>
</head>
<body>
    <main class="auth-card">
        <div class="logo">PromptMate</div>
        <h1>Forgot Password?</h1>
        <p class="subtitle">
            Enter your account email address to request a password reset.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your account email"
                required
            >
            <button type="submit">Request Reset Link</button>
        </form>

        <div class="links">
            <p><a href="{{ url_for('login') }}">Back to Sign In</a></p>
        </div>
    </main>
</body>
</html>
